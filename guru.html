<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Profil Guru | Mitra Al-Khaidir Boarding School</title>
<meta name="description" content="Daftar pengelola dan guru Mitra Al-Khaidir Boarding School, Cianjur.">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;800&family=Young+Serif&display=swap" rel="stylesheet">
<meta name="theme-color" content="#06361f">
<link rel="stylesheet" href="/sub.css">
<link rel="stylesheet" href="/news.css">
</head>
<body>
<header class="top"><div class="wrap"><a class="logo" href="/"><span class="lg" aria-hidden="true"></span><span>Mitra Al-Khaidir<small>Boarding School</small></span></a>
<nav aria-label="Menu utama"><a href="/#beranda">Beranda</a><a href="/#lembaga">Lembaga</a><a href="/guru" class="on">Guru</a><a href="/#kehidupan">Kehidupan</a><a href="/berita">Berita</a><a href="/#galeri">Galeri</a><a href="/#ppdb">PPDB</a><a href="/#kontak">Contact</a></nav></div></header>
<main>
  <div class="ph"><div class="wrap"><h1>Profil Guru</h1><p>Para pengelola dan pengajar yang bertanggung jawab atas Mitra Al-Khaidir.</p></div></div>
  <section class="sec"><div class="wrap"><div id="groups" aria-live="polite"><p class="nempty">Memuat data...</p></div></div></section>
</main>
<footer><div class="wrap"><span>&copy; 2026 Yayasan Mitra Al-Khaidir. Seluruh hak cipta dilindungi.</span><span><a href="/">Kembali ke beranda</a> | <a href="/masuk">Masuk admin</a></span></div></footer>
<script>
document.addEventListener('DOMContentLoaded',function(){
  var box=document.getElementById('groups');
  var TITLE={'Yayasan':'Yayasan Al-Khaidir','Pondok Pesantren':'Pondok Pesantren','SMP Islam':'SMP Islam','Madrasah Aliyah':'Madrasah Aliyah'};
  function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
  function initials(n){var w=n.replace(/^((H|Hj|Dr|Drs|Dra|Ust|Ustadz|Ustadzah|K\.?H|Prof)\.?\s+)+/i,'').split(/[\s,.]+/).filter(Boolean);return ((w[0]||'?')[0]+(w[1]?w[1][0]:(w[0]||'').slice(1,2))).toUpperCase()}
  fetch('/api/staff').then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(j){
    box.textContent='';
    if(!j.items.length){box.appendChild(el('p','nempty',j.db===false?'Data belum tersedia.':'Data pengelola belum diisi.'));return}
    j.groups.forEach(function(g){
      var list=j.items.filter(function(x){return x.group===g});if(!list.length)return;
      var sec=el('section','staffgrp');sec.appendChild(el('h2',null,TITLE[g]||g));
      var grid=el('div','staff');
      list.forEach(function(p){
        var c=el('article','scard'),av=el('div','av');
        if(p.photo){var im=new Image();im.src=p.photo;im.alt='Foto '+p.name;im.loading='lazy';av.appendChild(im)}else{av.textContent=initials(p.name);av.setAttribute('aria-hidden','true')}
        c.appendChild(av);c.appendChild(el('h3',null,p.name));c.appendChild(el('p',null,p.role));grid.appendChild(c)});
      sec.appendChild(grid);box.appendChild(sec)});
  }).catch(function(){box.textContent='';box.appendChild(el('p','nempty','Data belum tersedia.'))});
});
</script>
</body>
</html>
